# Локальная разработка: docker compose -f infra/docker-compose.yml up -d
# Для локального медиа: cd backend && make media-up
name: vetka

# Pinned mirror of the MinIO Community image for local development.
x-minio-image: &minio-image ${MEDIA_MINIO_IMAGE:-ghcr.io/projekt-manager-org/minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vetka
      POSTGRES_PASSWORD: vetka
      POSTGRES_DB: vetka
    ports: ["${PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetka"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  minio:
    profiles: [media]
    image: *minio-image
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-vetka-local}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-vetka-local-media-secret}
    ports: ["${MEDIA_BIND_ADDR:-127.0.0.1}:${MEDIA_S3_PORT:-9000}:9000"]
    volumes: [mediadata:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      retries: 20

  media-bucket:
    profiles: [media]
    image: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-vetka-local}
      S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-vetka-local-media-secret}
      S3_BUCKET: ${MEDIA_S3_BUCKET:-vetka-media}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"

  imgproxy:
    profiles: [media]
    image: ghcr.io/imgproxy/imgproxy:v4.0.0
    depends_on:
      media-bucket:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY:-vetka-local}
      AWS_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_KEY:-vetka-local-media-secret}
      IMGPROXY_KEY: ${MEDIA_IMGPROXY_KEY:-be294336dd4a24b75ed66324f1dfa1913c5636fd56c9ce04c2f289a204341318}
      IMGPROXY_SALT: ${MEDIA_IMGPROXY_SALT:-eff5649cc662013426e679e0bf9d021cdf0ab3b88ca6709fa4ef62b7fba826d2}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
      IMGPROXY_S3_ALLOWED_BUCKETS: ${MEDIA_S3_BUCKET:-vetka-media}
      IMGPROXY_ALLOWED_SOURCES: s3://${MEDIA_S3_BUCKET:-vetka-media}/images/
    ports: ["${MEDIA_BIND_ADDR:-127.0.0.1}:${MEDIA_IMGPROXY_PORT:-8090}:8080"]
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
  redisdata:
  mediadata:
