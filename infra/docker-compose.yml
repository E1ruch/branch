# Локальная разработка: docker compose -f infra/docker-compose.yml up -d
# S3 (MinIO) и imgproxy добавятся вместе с модулем медиа.
name: vetka

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vetka
      POSTGRES_PASSWORD: vetka
      POSTGRES_DB: vetka
    ports: ["${PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetka"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
  redisdata:
